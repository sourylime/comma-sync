name: GUI Release

# Push a tag like `gui-v1.0.0-beta.1` to build the Linux + Windows installers and
# publish them as a GitHub PRE-RELEASE (beta). Pre-releases are never marked
# "latest", so this never shadows the macOS app's stable releases on main.
on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (webkit2gtk etc.)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Build the Go core as a Tauri sidecar
        shell: bash
        working-directory: core
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p ../gui/src-tauri/binaries
          go build -trimpath -ldflags "-s -w" \
            -o "../gui/src-tauri/binaries/comma-sync-${triple}${ext}" .
      - name: Build installers and publish the pre-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Comma Sync ${{ github.ref_name }} — Go core beta (all platforms)"
          releaseBody: |
            **Beta builds powered by the new shared Go core** — the same engine across
            macOS, Linux, and Windows (native SSH/SFTP + discovery; only `ffmpeg` is
            external). The stable macOS app on `main` is unaffected.

            **What's here**
            - **macOS:** `Comma-Sync-Go-macOS.zip` — the SwiftUI app wired to the Go core.
            - **Linux:** `.AppImage` (`chmod +x` then run) or `.deb` (`sudo apt install ./*.deb`).
            - **Windows:** the `.msi` (or NSIS `*-setup.exe`).

            This round ports the script's fixes into the core: **correct per‑segment audio
            sync** (no more drift / mic‑start gap), **mDNS discovery** (no WiFi‑disrupting
            scan), and the **power‑throttle**. A built‑in update check (on by default,
            toggle to disable) points you at the next beta. **SHA‑256 checksums** for every
            file are attached (`*SHA256SUMS*`).

            **One requirement:** `ffmpeg`/`ffprobe` on your PATH.
            (`brew install ffmpeg` / `sudo apt install ffmpeg` / `winget install Gyan.FFmpeg`.)
            macOS/Windows are ad‑hoc/unsigned, so allow them on first launch (macOS: right‑click → Open).

            See the [GUI README](https://github.com/sourylime/comma-sync/blob/tauri-gui/gui/README.md).

            > ⚠️ Pre-release for testing — the macOS build works in basic testing; Linux
            > and Windows haven't been verified against a comma on real hardware yet.
            > **Please test and report any bugs.**
          prerelease: true
          releaseDraft: false
      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/SHA256SUMS-${{ runner.os }}.txt"
          : > "$out"
          find gui/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.msi' -o -name '*setup.exe' \) -print0 |
            while IFS= read -r -d '' f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
            done >> "$out"
          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber -R "${{ github.repository }}"

  macos-go-app:
    name: Build macOS Go-core app
    needs: release          # release job creates the GitHub release first
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build the SwiftUI app on the Go core
        run: |
          v="${GITHUB_REF_NAME#gui-v}"; v="${v%%-*}"   # gui-v1.0.2-beta.1 -> 1.0.2
          APP_VERSION="$v" bash macos-app-go/build.sh
      - name: Package + checksum + upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Comma Sync Go.app" Comma-Sync-Go-macOS.zip
          shasum -a 256 Comma-Sync-Go-macOS.zip > SHA256SUMS-macOS.txt
          cat SHA256SUMS-macOS.txt
          gh release upload "$GITHUB_REF_NAME" Comma-Sync-Go-macOS.zip SHA256SUMS-macOS.txt \
            --clobber -R "${{ github.repository }}"
