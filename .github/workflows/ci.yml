name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Shell lint & syntax (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          bash -n comma-sync.sh
          bash -n macos-app/build.sh
      - name: ShellCheck (fail only on errors)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: bash macos-app/build.sh
      - name: Verify bundle contents
        run: |
          test -f "Comma Sync.app/Contents/MacOS/CommaSync"
          test -f "Comma Sync.app/Contents/Resources/comma-sync.sh"
          test -f "Comma Sync.app/Contents/Resources/icon.icns"
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "Comma Sync.app" Comma-Sync-macOS.zip
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: Comma-Sync-macOS
          path: Comma-Sync-macOS.zip

  go-core:
    name: Build Go core
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Build
        working-directory: core
        run: go build ./...

  tauri-gui:
    name: Build Tauri GUI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (webkit2gtk etc.)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Build (compile check)
        working-directory: gui/src-tauri
        run: cargo build --locked || cargo build
